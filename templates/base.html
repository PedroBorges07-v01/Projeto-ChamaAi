<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}ChamaAí{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #145da0;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        main {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
        }

        input, textarea {
            display: block;
            width: 100%;
            max-width: 500px;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button, .botao {
            background: #145da0;
            color: white;
            padding: 9px 13px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }

        .mensagem {
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .sucesso {
            background: #d4edda;
            color: #155724;
        }

        .erro {
            background: #f8d7da;
            color: #721c24;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e8eef5;
        }

        .inativo {
            color: #a11;
        }

        .acoes form {
            display: inline;
        }
    </style>
</head>

<body>
    <header>
        <h1>ChamaAí</h1>
        <p>Marketplace de serviços sob demanda</p>

        <nav>
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('listar_categorias') }}">Categorias</a>
            <a href="{{ url_for('nova_categoria') }}">Nova categoria</a>
            <a href="{{ url_for('listar_prestadores') }}">Prestadores</a>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for tipo, mensagem in mensagens %}
                <div class="mensagem {{ tipo }}">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
