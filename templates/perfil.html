{% extends "base.html" %}

{% block titulo %}Meu perfil | ChamaAí{% endblock %}

{% block conteudo %}
<h2>Meu perfil</h2>

<form method="POST" action="{{ url_for('perfil') }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" required value="{{ current_user.nome }}">

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required value="{{ current_user.email }}">

    <label for="senha">Nova senha (opcional)</label>
    <input id="senha" name="senha" type="password" minlength="8">

    {% if current_user.tipo == "cliente" %}
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" value="{{ cliente.telefone if cliente else '' }}">

        <label for="cidade">Cidade</label>
        <input id="cidade" name="cidade" value="{{ cliente.cidade if cliente else '' }}">
    {% endif %}

    {% if current_user.tipo == "prestador" %}
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" value="{{ prestador.telefone if prestador else '' }}">

        <label for="especialidade">Especialidade</label>
        <input id="especialidade" name="especialidade"
               value="{{ prestador.especialidade if prestador else '' }}">
    {% endif %}

    <button type="submit">Salvar perfil</button>
    <a class="botao botao-secundario" href="{{ url_for('painel') }}">Voltar ao painel</a>
</form>
{% endblock %}
