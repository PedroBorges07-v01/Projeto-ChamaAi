
{% extends "base.html" %}

{% block conteudo %}
<h1>Cadastro de cliente</h1>

<form method="POST" action="{{ url_for('novo_cliente') }}">
    <label for="nome">Nome completo</label>
    <input
        type="text"
        id="nome"
        name="nome"
        required
    >

    <label for="email">E-mail</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="senha">Senha</label>
    <input
        type="password"
        id="senha"
        name="senha"
        minlength="8"
        required
    >

    <button type="submit">Cadastrar</button>
</form>

<p>Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a>.</p>
{% endblock %}
