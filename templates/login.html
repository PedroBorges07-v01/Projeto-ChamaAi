{% extends "base.html" %}

{% block titulo %}Login | ChamaAí{% endblock %}

{% block conteudo %}
<h1>Entrar no ChamaAí</h1>
<p>Use o e-mail e a senha da sua conta de cliente, prestador ou administrador.</p>

<form method="POST" action="{{ url_for('login') }}">
    <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required autocomplete="current-password">
    </div>
    <button type="submit">Entrar</button>
</form>

<p>Ainda não tem conta? <a href="{{ url_for('novo_cliente') }}">Cadastre-se como cliente</a>
ou <a href="{{ url_for('novo_prestador') }}">como prestador</a>.</p>
{% endblock %}
