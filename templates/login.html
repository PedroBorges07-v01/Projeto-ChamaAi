
{% extends "base.html" %}

{% block conteudo %}
<h1>Entrar no ChamaAí</h1>

<form method="POST" action="{{ url_for('login') }}">
    <div>
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
        >
    </div>

    <div>
        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
            autocomplete="current-password"
        >
    </div>

    <button type="submit">Entrar</button>
</form>
{% endblock %}
